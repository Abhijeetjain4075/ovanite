name: Backend source quality

on:
  pull_request:
    paths:
      - "src/backend/**"
      - "test/pocketic/backend.test.ts"
      - "mops.toml"
      - "mops.lock"
      - "icp.yaml"
      - ".github/workflows/backend-quality.yml"
  push:
    branches: [main, mavis]
    paths:
      - "src/backend/**"
      - "test/pocketic/backend.test.ts"
      - "mops.toml"
      - "mops.lock"
      - "icp.yaml"
      - ".github/workflows/backend-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-source-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Motoko checks and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check submitted patch whitespace
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$PR_BASE_SHA" "$PR_HEAD_SHA"
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]]; then
            git diff --check "$PUSH_BEFORE" "$GITHUB_SHA"
          else
            git diff --check HEAD^ HEAD
          fi

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install pinned Mops
        run: npm install --global ic-mops@3.5.1

      - name: Install pinned ICP CLI and Wasm tooling
        run: npm install --global @icp-sdk/icp-cli@1.7.0 @icp-sdk/ic-wasm@0.11.1

      - name: Report tool versions
        run: |
          mops --version
          icp --version
          ic-wasm --version

      - name: Validate locked dependencies
        run: mops install --locked

      - name: Typecheck, lint, and check stable-state compatibility
        run: mops check backend

      - name: Build backend with Mops
        run: mops build backend

      - name: Validate standalone ICP CLI recipe
        run: icp build backend

      - name: Verify backend artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -s src/backend/dist/backend.wasm
          test -s src/backend/dist/backend.did
          test -s src/backend/dist/backend.most

      - name: Deploy to disposable local ICP network and smoke-test public reads
        shell: bash
        run: |
          set -euo pipefail
          icp network start -d
          trap 'icp network stop || true' EXIT
          icp deploy backend

          # A fresh install must apply the enhanced migration chain and seed all
          # five public FAQs before the application is exposed.
          faq_output="$(icp canister call backend listPublishedFaqs '(10 : nat)')"
          printf '%s\n' "$faq_output"
          grep -Fq "What does Ovanite build?" <<<"$faq_output"
          grep -Fq "How does Ovanite work?" <<<"$faq_output"
          grep -Fq "How can I get in touch with Ovanite?" <<<"$faq_output"
          grep -Fq "How does the waitlist work?" <<<"$faq_output"
          grep -Fq "Where does Ovanite operate?" <<<"$faq_output"

          icp canister call backend listPublishedProducts '()'
          icp canister call backend getSiteContent '()'
          owner_claimed="$(icp canister call backend isOwnerClaimed '()')"
          printf '%s\n' "$owner_claimed"
          grep -Fq 'true' <<<"$owner_claimed"

          # An unregistered caller must not see administrative state.
          is_admin="$(icp canister call backend isCallerAdmin '()')"
          printf '%s\n' "$is_admin"
          grep -Fq 'false' <<<"$is_admin"

          if admins_output="$(icp canister call backend listAdmins '()' 2>&1)"; then
            echo "SECURITY FAILURE: an unregistered caller read the admin list." >&2
            exit 1
          fi
          printf '%s\n' "$admins_output"
          grep -Fq "Unauthorized: admin access required" <<<"$admins_output"

          # The default local CLI caller is anonymous; it must be rejected
          # before any email-based owner bootstrap can occur.
          if icp canister call backend claimOwner '("therealabhijeetjain@gmail.com")'; then
            echo "SECURITY FAILURE: anonymous owner claim unexpectedly succeeded" >&2
            exit 1
          fi

          # Create an ephemeral, non-anonymous test identity only for this
          # disposable CI network. Suppress all CLI output: identity creation
          # can print a seed phrase, which must never appear in CI logs.
          icp identity new --storage plaintext ci-unregistered >/dev/null 2>&1

          signed_in_owner_claimed="$(icp canister call backend isOwnerClaimed '()' --identity ci-unregistered)"
          printf '%s\n' "$signed_in_owner_claimed"
          grep -Fq '(true)' <<<"$signed_in_owner_claimed"

          # This verifies the signed-in, but unconfigured, owner-bootstrap path
          # (the anonymous negative test above covers its earlier guard).
          if signed_in_claim_output="$(icp canister call backend claimOwner '("therealabhijeetjain@gmail.com")' --identity ci-unregistered 2>&1)"; then
            echo "SECURITY FAILURE: a signed-in unconfigured principal claimed ownership." >&2
            exit 1
          fi
          printf '%s\n' "$signed_in_claim_output"
          grep -Fq "owner principal is not configured" <<<"$signed_in_claim_output"

          if signed_in_admins_output="$(icp canister call backend listAdmins '()' --identity ci-unregistered 2>&1)"; then
            echo "SECURITY FAILURE: a signed-in unregistered principal read the admin list." >&2
            exit 1
          fi
          printf '%s\n' "$signed_in_admins_output"
          grep -Fq "Unauthorized: admin access required" <<<"$signed_in_admins_output"

          # The backend release policy must reject direct canister calls even
          # though the frontend has a separate UI-only release flag.
          if contact_output="$(icp canister call backend submitContact '(record { name = "Direct Caller"; email = "direct@example.com"; message = "This direct canister call must remain blocked."; })' 2>&1)"; then
            echo "SECURITY FAILURE: public Contact submission unexpectedly succeeded" >&2
            printf '%s\n' "$contact_output"
            exit 1
          fi
          grep -Fiq "Public submissions are disabled by backend release policy" <<<"$contact_output"

          if waitlist_output="$(icp canister call backend submitWaitlist '(record { name = "Direct Caller"; email = "direct@example.com"; note = opt "Interested in early access."; })' 2>&1)"; then
            echo "SECURITY FAILURE: public Waitlist submission unexpectedly succeeded" >&2
            printf '%s\n' "$waitlist_output"
            exit 1
          fi
          grep -Fiq "Public submissions are disabled by backend release policy" <<<"$waitlist_output"

      - name: Verify owner, editor, viewer, and owner-role uniqueness on local ICP
        shell: bash
        run: |
          set -euo pipefail
          source_file="src/backend/lib/admin.mo"
          backup="$(mktemp)"
          cp "$source_file" "$backup"
          restore_source() {
            cp "$backup" "$source_file"
            rm -f "$backup"
          }
          cleanup() {
            icp network stop || true
            restore_source
          }
          trap cleanup EXIT

          # Create disposable test identities without logging their key material.
          icp identity new --storage plaintext ci-configured-owner >/dev/null 2>&1
          icp identity new --storage plaintext ci-viewer >/dev/null 2>&1
          icp identity new --storage plaintext ci-editor >/dev/null 2>&1
          owner_principal="$(icp identity principal --identity ci-configured-owner)"
          viewer_principal="$(icp identity principal --identity ci-viewer)"
          editor_principal="$(icp identity principal --identity ci-editor)"
          test -n "$owner_principal"
          test -n "$viewer_principal"
          test -n "$editor_principal"

          python3 - "$source_file" "$owner_principal" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          principal = sys.argv[2]
          source = path.read_text()
          old = "public let ownerPrincipal : ?Principal = null;"
          new = f'public let ownerPrincipal : ?Principal = ?Principal.fromText("{principal}");'
          if source.count(old) != 1:
              raise SystemExit("Expected exactly one safe-default ownerPrincipal declaration")
          path.write_text(source.replace(old, new))
          PY

          # This fixture exists only for this isolated test step. The cleanup
          # trap restores the safe-default production source even after failure.
          mops check backend
          mops build backend
          icp build backend
          icp network start -d
          icp deploy backend

          claim_output="$(icp canister call backend claimOwner '("therealabhijeetjain@gmail.com")' --identity ci-configured-owner)"
          printf '%s\n' "$claim_output"
          grep -Fq 'true' <<<"$claim_output"

          viewer_add="$(icp canister call backend addAdmin "(principal \"$viewer_principal\", variant { viewer })" --identity ci-configured-owner)"
          editor_add="$(icp canister call backend addAdmin "(principal \"$editor_principal\", variant { editor })" --identity ci-configured-owner)"
          grep -Fq 'true' <<<"$viewer_add"
          grep -Fq 'true' <<<"$editor_add"

          # Viewers can read protected content, but all mutation APIs reject them.
          viewer_read="$(icp canister call backend listAllFaqs '()' --identity ci-viewer)"
          test -n "$viewer_read"
          if viewer_write="$(icp canister call backend createFaq '(record { question = "Viewer must not write"; answer = "This must be rejected"; sortOrder = 99 : nat })' --identity ci-viewer 2>&1)"; then
            echo "SECURITY FAILURE: viewer created an FAQ." >&2
            exit 1
          fi
          printf '%s\n' "$viewer_write"
          grep -Fq 'editor or owner access required' <<<"$viewer_write"

          # Editors can manage content, but cannot manage the admin team.
          editor_write="$(icp canister call backend createFaq '(record { question = "Editor write test"; answer = "Editor permission works"; sortOrder = 99 : nat })' --identity ci-editor)"
          printf '%s\n' "$editor_write"
          grep -Fq 'Editor write test' <<<"$editor_write"

          # Product links are external navigation targets: reject script schemes
          # at the canister boundary, even when called directly by an editor.
          if unsafe_product="$(icp canister call backend createProduct '(record { name = "Unsafe link test"; description = "Must reject script schemes"; link = opt "javascript:alert(1)"; imageKey = null; imageUrl = null; sortOrder = 99 : nat })' --identity ci-editor 2>&1)"; then
            echo "SECURITY FAILURE: a script-scheme product link was accepted." >&2
            exit 1
          fi
          printf '%s\n' "$unsafe_product"
          grep -Fq 'Product link must use HTTPS' <<<"$unsafe_product"

          safe_product="$(icp canister call backend createProduct '(record { name = "Safe link test"; description = "HTTPS links are permitted"; link = opt "https://example.com/docs"; imageKey = null; imageUrl = null; sortOrder = 100 : nat })' --identity ci-editor)"
          printf '%s\n' "$safe_product"
          grep -Fq 'https://example.com/docs' <<<"$safe_product"

          # Required content text is bounded in the canister, not just the UI.
          long_question="$(python3 -c 'print("Q" * 301)')"
          if oversized_faq="$(icp canister call backend createFaq "(record { question = \"$long_question\"; answer = \"Bounded answer\"; sortOrder = 101 : nat })" --identity ci-editor 2>&1)"; then
            echo "SECURITY FAILURE: an oversized FAQ question was accepted." >&2
            exit 1
          fi
          printf '%s\n' "$oversized_faq"
          grep -Fq 'FAQ question has an invalid length' <<<"$oversized_faq"

          if editor_team_change="$(icp canister call backend addAdmin "(principal \"$viewer_principal\", variant { viewer })" --identity ci-editor 2>&1)"; then
            echo "SECURITY FAILURE: editor changed the admin roster." >&2
            exit 1
          fi
          grep -Fq 'owner access required' <<<"$editor_team_change"

          # A second #owner role is never assignable through ordinary admin APIs.
          second_owner="$(icp canister call backend addAdmin "(principal \"$editor_principal\", variant { owner })" --identity ci-configured-owner)"
          printf '%s\n' "$second_owner"
          grep -Fq 'false' <<<"$second_owner"
          owner_role_change="$(icp canister call backend setAdminRole "(principal \"$editor_principal\", variant { owner })" --identity ci-configured-owner)"
          printf '%s\n' "$owner_role_change"
          grep -Fq 'null' <<<"$owner_role_change"
          editor_owner_status="$(icp canister call backend isCallerOwner '()' --identity ci-editor)"
          grep -Fq 'false' <<<"$editor_owner_status"
