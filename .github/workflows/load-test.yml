name: Load test a deployed target

# Manual only, deliberately. A capacity verdict needs a deployed environment and
# representative data; running this on a schedule or against a guessed URL would
# produce numbers that look like evidence and are not.

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "HTTPS URL to load (for example https://portal.example.com/api/health/live)"
        required: true
        type: string
      concurrency:
        description: "Parallel workers (1-100)"
        required: false
        default: "10"
        type: string
      duration_seconds:
        description: "Test duration in seconds (1-300)"
        required: false
        default: "30"
        type: string
      p95_ms:
        description: "p95 latency objective in milliseconds"
        required: false
        default: "500"
        type: string
      max_error_rate:
        description: "Maximum ratio of non-2xx/3xx responses (0-1)"
        required: false
        default: "0.01"
        type: string

permissions:
  contents: read

jobs:
  load:
    name: Load test and record the summary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Validate HTTPS target, hostname allowlist, and public DNS
        env:
          TARGET_URL: ${{ inputs.target_url }}
          ALLOWED_HOSTS: ${{ vars.OVANITE_LOAD_TEST_ALLOWED_HOSTS }}
          CONCURRENCY: ${{ inputs.concurrency }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ipaddress
          import os
          import socket
          import sys
          from urllib.parse import urlsplit

          raw = os.environ["TARGET_URL"]
          if any(ord(char) < 32 or ord(char) == 127 for char in raw):
              sys.exit("Refusing target: control characters are not allowed.")
          parsed = urlsplit(raw)
          if parsed.scheme != "https" or not parsed.hostname or parsed.username or parsed.password:
              sys.exit("Refusing target: absolute HTTPS URL without credentials is required.")
          host = parsed.hostname.lower().rstrip(".")
          allowed = {
              item.strip().lower().rstrip(".")
              for item in os.environ.get("ALLOWED_HOSTS", "").split(",")
              if item.strip()
          }
          if not allowed or host not in allowed:
              sys.exit("Refusing target: hostname is not in OVANITE_LOAD_TEST_ALLOWED_HOSTS.")
          try:
              concurrency = int(os.environ.get("CONCURRENCY", "10"))
              if concurrency < 1 or concurrency > 100:
                  sys.exit("Refusing target: concurrency must be between 1 and 100.")
              records = socket.getaddrinfo(host, parsed.port or 443, type=socket.SOCK_STREAM)
              addresses = {record[4][0].split("%", 1)[0] for record in records}
              if not addresses:
                  raise RuntimeError("no DNS answers")
              non_public = [address for address in addresses if not ipaddress.ip_address(address).is_global]
              if non_public:
                  sys.exit("Refusing target: hostname resolves to a non-public IP address.")
          except SystemExit:
              raise
          except Exception:
              sys.exit("Refusing target: DNS resolution failed or returned an invalid address.")
          print(f"Target accepted: https://{host}{parsed.path or '/'}")
          PY

      - name: Run the load test
        env:
          TARGET_URL: ${{ inputs.target_url }}
          CONCURRENCY: ${{ inputs.concurrency }}
          DURATION_SECONDS: ${{ inputs.duration_seconds }}
          P95_MS: ${{ inputs.p95_ms }}
          MAX_ERROR_RATE: ${{ inputs.max_error_rate }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/load-test.mjs \
            --url "$TARGET_URL" \
            --concurrency "$CONCURRENCY" \
            --duration "$DURATION_SECONDS" \
            --p95 "$P95_MS" \
            --max-error-rate "$MAX_ERROR_RATE" \
            --max-response-bytes 1048576 \
            --json | tee load-summary.json

      - name: Upload the load-test summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-summary
          path: load-summary.json
          retention-days: 30
          if-no-files-found: warn
