name: One-time participant portal dependency remediation

on:
  push:
    branches: [mavis]
    paths:
      - ".github/workflows/participant-portal-dependency-refresh.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: participant-portal-dependency-remediation
  cancel-in-progress: false

jobs:
  refresh-and-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/participant-portal
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v6
        with:
          ref: mavis
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.18.0 --activate
      - name: Regenerate lockfile using patched dependency overrides
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck
        run: pnpm check
      - name: Unit tests
        run: pnpm test
      - name: Production build
        run: pnpm build
      - name: Report remaining dependency and configuration findings
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: apps/participant-portal
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
      - name: Commit verified lockfile refresh
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/participant-portal/pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfile is already current."
            exit 0
          fi
          git commit -m "fix: refresh vulnerable participant portal dependencies"
          git push origin HEAD:mavis
