name: Backend source quality

on:
  pull_request:
    paths:
      - "src/backend/**"
      - "mops.toml"
      - "mops.lock"
      - "icp.yaml"
      - ".github/workflows/backend-quality.yml"
  push:
    branches: [main, mavis]
    paths:
      - "src/backend/**"
      - "mops.toml"
      - "mops.lock"
      - ".github/workflows/backend-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-source-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Motoko checks and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install pinned Mops
        run: npm install --global ic-mops@3.5.1

      - name: Install pinned ICP CLI and Wasm tooling
        run: npm install --global @icp-sdk/icp-cli@1.5.0 @icp-sdk/ic-wasm@0.11.1

      - name: Report tool versions
        run: |
          mops --version
          icp --version
          ic-wasm --version

      - name: Validate locked dependencies
        run: mops install

      - name: Typecheck, lint, and check stable-state compatibility
        run: mops check backend

      - name: Build backend with Mops
        run: mops build backend

      - name: Validate standalone ICP CLI recipe
        run: icp build backend

      - name: Verify backend artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -s src/backend/dist/backend.wasm
          test -s src/backend/dist/backend.did
          test -s src/backend/dist/backend.most
          git diff --check
